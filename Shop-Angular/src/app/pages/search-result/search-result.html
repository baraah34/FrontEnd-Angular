<h1 class="page-title">Search Products</h1>

<div class="search-box">

  <input
    type="text"
    placeholder="Search products..."

    [(ngModel)]="searchText"
  />

</div>

<div class="grid">

  @for (product of filterProducts; track product.id) {

    <app-product-card
      [product]="product">
    </app-product-card>

  }

</div>
